  </defs>
  <rect width="512" height="512" fill="url(#bga)"/>
  <g fill="#ffffff">
    <rect x="120" y="160" width="272" height="24" rx="12" opacity=".45"/>
    <rect x="120" y="214" width="222" height="24" rx="12" opacity=".62"/>
    <rect x="100" y="264" width="312" height="42" rx="21"/>
    <rect x="120" y="332" width="256" height="24" rx="12" opacity=".62"/>
    <rect x="120" y="386" width="176" height="24" rx="12" opacity=".45"/>
  </g>
