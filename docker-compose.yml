# Uso local:  docker compose up --build   ->  http://localhost:8080
# Com servidor PeerJS próprio: docker compose --profile peer up --build
services:
  teleprompter:
    build: .
    image: fmp-barzi-prompter:latest
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      # Onde ficam as contas e os roteiros da equipe. Sem isto os dados
      # somem a cada deploy.
      - barzi-dados:/data
    environment:
      PORT: "80"
      # Contas da equipe. Preencha para ativar login e biblioteca compartilhada;
      # deixe em branco e o app volta a ser 100% local no navegador.
      ADMIN_EMAIL: "${ADMIN_EMAIL:-}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      ADMIN_NAME: "${ADMIN_NAME:-}"
      # Gerador de roteiro com IA. Com a chave aqui ela fica no servidor e
      # nunca chega ao navegador de quem usa o app.
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      # ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      # AI_MODEL: ""            # vazio = escolhe o melhor disponível na conta
      # AI_RATE_PER_MIN: "10"   # gerações por IP por minuto
      # Descomente para usar o servidor PeerJS abaixo em vez do público.
      # Em produção aponte para o domínio público do serviço peerjs.
      # PEER_HOST: "peer.seudominio.com"
      # PEER_PORT: "443"
      # PEER_PATH: "/"
      # PEER_SECURE: "true"

  # Opcional: broker de sinalização do controle remoto sob o seu domínio.
  # O tráfego de vídeo/comandos continua indo direto entre os dispositivos (WebRTC).
  peerjs:
    image: peerjs/peerjs-server:latest
    profiles: ["peer"]
    restart: unless-stopped
    command: ["--port", "9000", "--path", "/"]
    ports:
      - "9000:9000"

volumes:
  barzi-dados:
