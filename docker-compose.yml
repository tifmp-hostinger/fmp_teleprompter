# Uso local:  docker compose up --build   ->  http://localhost:8080
# Com servidor PeerJS próprio: docker compose --profile peer up --build
services:
  teleprompter:
    build: .
    image: fmp-teleprompter:latest
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PORT: "80"
      # Descomente para usar o servidor PeerJS abaixo em vez do público.
      # Em produção aponte para o domínio público do serviço peerjs.
      # PEER_HOST: "peer.seudominio.com"
      # PEER_PORT: "443"
      # PEER_PATH: "/"
      # PEER_SECURE: "true"

  # Opcional: broker de sinalização do controle remoto sob o seu domínio.
  # O tráfego de vídeo/comandos continua indo direto entre os dispositivos (WebRTC).
  peerjs:
    image: peerjs/peerjs-server:latest
    profiles: ["peer"]
    restart: unless-stopped
    command: ["--port", "9000", "--path", "/"]
    ports:
      - "9000:9000"
