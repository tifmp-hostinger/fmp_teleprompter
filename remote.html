<!doctype html>
<html lang="pt-BR" data-theme="dark" data-title-key="remoteTitle">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>FMP Barzi Prompter — Controle remoto</title>
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark light">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Barzi Remoto">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/styles.css">
  <script src="config.js"></script>
</head>
<body>
  <main class="remote-page">
    <h1><img src="icons/icon.svg" alt=""><span data-i18n="remoteTitle"></span></h1>

    <section id="connectPane">
      <p class="hint" data-i18n="remoteEnterCode"></p>
      <input id="codeInput" class="code-input" type="text" maxlength="6" autocomplete="off" autocapitalize="characters" placeholder="ABC123">
      <button id="btnConnect" class="btn primary big" style="width:100%;margin-top:12px" data-i18n="connect"></button>
      <div id="status" class="status" style="margin-top:12px"></div>
    </section>

    <section id="controlPane" hidden>
      <div class="remote-stats"><span id="rTitle"></span><span id="rStatus" class="status ok" data-i18n="connected"></span></div>
      <div class="remote-context"><span id="rContext">…</span></div>
      <div class="progress" id="rProgress" style="margin:12px 0"><div id="rFill" style="position:absolute;left:0;top:0;bottom:0;width:0;background:var(--accent);border-radius:999px"></div></div>
      <div class="remote-stats">
        <span><span data-i18n="elapsed"></span> <b id="rElapsed">0:00</b></span>
        <span><span data-i18n="remaining"></span> <b id="rRemaining">0:00</b></span>
      </div>

      <div class="remote-speed" style="margin:16px 0">
        <div class="speed-label"><b id="rSpeed">150</b><span id="rSpeedUnit" data-i18n="wpm"></span></div>
        <div id="rDial"></div>
      </div>

      <div class="remote-grid">
        <button class="btn" data-cmd='{"a":"seek","lines":-4}'>↑<small data-i18n="shLeftRight"></small></button>
        <button class="btn" data-cmd='{"a":"restart"}'>⟲<small data-i18n="restart"></small></button>
        <button class="btn" data-cmd='{"a":"seek","lines":4}'>↓<small data-i18n="shLeftRight"></small></button>
        <button id="rPlay" class="btn primary play" data-cmd='{"a":"toggle"}'>▶</button>
        <button class="btn" data-cmd='{"a":"mode","v":"fixed"}'>⏱<small data-i18n="modeFixed"></small></button>
        <button class="btn" data-cmd='{"a":"mode","v":"voice"}'>🎙<small data-i18n="modeVoice"></small></button>
        <button class="btn" data-cmd='{"a":"mode","v":"manual"}'>✋<small data-i18n="modeManual"></small></button>
      </div>
      <div class="remote-grid two" style="margin-top:10px">
        <button class="btn" data-cmd='{"a":"font","d":-4}'>A−<small data-i18n="fontSize"></small></button>
        <button class="btn" data-cmd='{"a":"font","d":4}'>A+<small data-i18n="fontSize"></small></button>
      </div>
    </section>
  </main>

  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script type="module">
    import { RemoteClient, normalizeCode } from './js/remote.js';
    import { applyTranslations, t } from './js/i18n.js';
    import { formatTime } from './js/script-parser.js';
    import { loadSettings } from './js/storage.js';
    import { DragDial } from './js/slider.js';

    // Segue o tema escolhido no app.
    const theme = loadSettings().theme;
    document.documentElement.dataset.theme = ['dark', 'light', 'mono'].includes(theme) ? theme : 'dark';
    document.querySelector('meta[name="theme-color"]').content = theme === 'light' ? '#f2f2f7' : '#000000';

    applyTranslations(document);
    const $ = (s) => document.querySelector(s);
    const params = new URLSearchParams(location.search);
    const codeInput = $('#codeInput');
    codeInput.value = normalizeCode(params.get('code') || '');
    let client = null;
    let wakeLock = null;
    let mode = 'fixed';

    const dial = new DragDial($('#rDial'), {
      min: 40, max: 400, step: 5, value: 150, label: t('speed'),
      format: (v) => (mode === 'timed' ? formatTime(v * 60) : String(v)),
      onInput: (v) => {
        $('#rSpeed').textContent = mode === 'timed' ? formatTime(v * 60) : String(v);
        client?.send({ a: 'setSpeed', v });
      },
    });

    function configureDial(state) {
      if (mode === 'timed') {
        dial.configure({ min: 0.5, max: 60, step: 0.5, value: state.targetMinutes ?? 3, label: t('targetDuration') });
      } else {
        dial.configure({ min: 40, max: 400, step: 5, value: state.wpm ?? 150, label: t('speed') });
      }
    }

    async function connect() {
      const code = normalizeCode(codeInput.value);
      if (code.length < 6) return;
      client?.close();
      $('#status').className = 'status'; $('#status').textContent = t('connecting');
      client = new RemoteClient(code, {
        onOpen: async () => {
          $('#connectPane').hidden = true; $('#controlPane').hidden = false;
          history.replaceState(null, '', `?code=${code}`);
          try { wakeLock = await navigator.wakeLock?.request('screen'); } catch { /* ignore */ }
        },
        onState: (s) => {
          $('#rTitle').textContent = s.title || '';
          $('#rContext').textContent = s.context || '…';
          $('#rFill').style.width = `${(s.progress || 0) * 100}%`;
          $('#rElapsed').textContent = formatTime(s.elapsed);
          $('#rRemaining').textContent = formatTime(s.remaining);
          $('#rPlay').textContent = s.playing ? '❚❚' : '▶';
          const timed = s.mode === 'timed';
          if (s.mode !== mode) { mode = s.mode; configureDial(s); }
          $('#rSpeedUnit').textContent = timed ? t('targetDuration') : t('wpm');
          $('#rSpeed').textContent = timed ? formatTime((s.targetMinutes ?? 3) * 60) : String(s.wpm);
          if (!dial.dragging) dial.set(timed ? (s.targetMinutes ?? 3) : s.wpm, true);
        },
        onClose: () => { $('#rStatus').className = 'status err'; $('#rStatus').textContent = t('disconnected'); },
        onError: () => {
          if ($('#controlPane').hidden) { $('#status').className = 'status err'; $('#status').textContent = t('notFound'); }
        },
      });
      client.connect();
    }

    $('#btnConnect').addEventListener('click', connect);
    codeInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') connect(); });
    codeInput.addEventListener('input', () => { codeInput.value = normalizeCode(codeInput.value); });
    document.querySelectorAll('[data-cmd]').forEach((b) => {
      b.addEventListener('click', () => { client?.send(JSON.parse(b.dataset.cmd)); if (navigator.vibrate) navigator.vibrate(10); });
    });
    $('#rProgress').addEventListener('click', (e) => {
      const r = e.currentTarget.getBoundingClientRect();
      client?.send({ a: 'progress', p: (e.clientX - r.left) / r.width });
    });
    document.addEventListener('visibilitychange', async () => {
      if (document.visibilityState === 'visible' && wakeLock?.released) {
        try { wakeLock = await navigator.wakeLock?.request('screen'); } catch { /* ignore */ }
      }
    });
    if (codeInput.value.length === 6) connect();
  </script>
</body>
</html>
